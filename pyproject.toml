# BibleLive monorepo tooling config (ruff, pytest, mypy).
#
# The installable Python package lives in backend/pyproject.toml; install it with
#   pip install -e ./backend
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-ra",
]
markers = [
    "integration: Tests that build a database or exercise a server",
    "audio: Tests that require the optional audio extras (faster-whisper, webrtcvad)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Starlette's TestClient currently warns when httpx2 is unavailable;
    # keep strict warning handling for everything else until TestClient is migrated.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # webrtcvad (Linux) does `import pkg_resources` at top level; setuptools 80
    # deprecates that API while the setuptools<81 pin keeps it importable.
    # Scoped to the importing module (stacklevel=2 attributes it to webrtcvad)
    # so the same message still errors anywhere else.
    "ignore:pkg_resources is deprecated:UserWarning:webrtcvad",
]

[tool.coverage.run]
source = ["backend/core", "backend/audio"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", "static", "data", "bible_data"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults
    "B904",   # raise from for exception chains
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"backend/tests/*" = ["ARG", "S101"]  # Allow unused args and asserts in tests

[tool.ruff.lint.isort]
known-first-party = ["core", "audio"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
ignore_missing_imports = true  # Many third-party packages lack types
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
