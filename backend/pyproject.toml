[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biblelive"
version = "0.1.0"
description = "Real-time Bible reference detection and display system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BibleLive Team"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=0.9.0",
    "numpy>=1.24.0",
    # webrtcvad imports pkg_resources: removed in setuptools 81+, absent from
    # Python 3.12+ venvs. Remove the pin once the VAD package stops importing it.
    "setuptools<81",
    # No prebuilt Windows wheels for webrtcvad; webrtcvad-wheels is a drop-in
    # providing the same `webrtcvad` module.
    "webrtcvad>=2.0.10; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "audio*"]
