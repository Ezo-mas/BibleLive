[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biblelive"
version = "0.1.0"
description = "Real-time Bible reference detection and display system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BibleLive Team"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.28.0",
    # QR codes in the launcher's "Other devices" panel (pure Python, no dependencies).
    "segno>=1.6.0",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.1.0",  # 1.1.0 added "large-v3-turbo"
    # faster-whisper's inference engine. 4.5+ is built for CUDA 12 and cuDNN 9
    # (the `cuda` extra below); a 5.x could change that, so it is opted into
    # deliberately rather than picked up by a fresh install.
    "ctranslate2>=4.5,<5",
    "numpy>=1.24.0",
    # webrtcvad imports pkg_resources: removed in setuptools 81+, absent from
    # Python 3.12+ venvs. Remove the pin once the VAD package stops importing it.
    "setuptools<81",
    # No prebuilt Windows wheels for webrtcvad; webrtcvad-wheels is a drop-in
    # providing the same `webrtcvad` module.
    "webrtcvad>=2.0.10; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10; sys_platform == 'win32'",
]
# GPU transcription (`--device cuda`): the CUDA 12 cuBLAS and cuDNN 9 libraries
# ctranslate2 4.x loads, as pip wheels instead of a system CUDA install. On
# Windows audio/stt.py finds them itself; on Linux see README (LD_LIBRARY_PATH).
cuda = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
]
# GGUF speech models for Lithuanian (`--stt kmynas|canary|kmynas+canary`,
# audio/stt_gguf.py) through transcribe.cpp. The default native library is
# CPU-only; for an NVIDIA GPU set TRANSCRIBE_LIBRARY to a CUDA build.
gguf = [
    "transcribe-cpp>=0.4,<0.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "audio*", "launcher*"]
