name: Windows installer

# Builds the per-user Windows installer (dist/BibleLive-Setup-<version>.exe).
# Manual runs upload the exe as a workflow artifact; v* tags also attach it to a GitHub release.
#
# Size limits: the exe is ~1.4 GB. GitHub release assets may be up to 2 GiB each and workflow
# artifacts up to 10 GB, so it fits; if the payload ever approaches 2 GiB the release upload
# will fail (the artifact upload still works). The exe is already compressed, so the artifact
# is uploaded with compression-level 0.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # attach the installer to the release on tags

jobs:
  installer:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        # Node version comes from .node-version, the same file fnm reads locally.
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python (only to build the Bible database)
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the Bible database from data/kjv2.json
        # bible_data/biblelive.sqlite is gitignored, but it is generated from the tracked
        # data/kjv2.json (DATABASE_SETUP.md), so CI can rebuild it. Fail loudly if it cannot.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend -c backend/constraints.txt
          New-Item -ItemType Directory -Force bible_data | Out-Null
          python -m core.import_bible --translation kjv --source data/kjv2.json --output bible_data/biblelive.sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Bible database import failed' }
          python -m core.import_bible --output bible_data/biblelive.sqlite --info
          if (-not (Test-Path bible_data/biblelive.sqlite) -or (Get-Item bible_data/biblelive.sqlite).Length -le 0) {
            throw 'bible_data/biblelive.sqlite was not created; the installer cannot be built without it.'
          }

      - name: Build the portable folder
        shell: pwsh
        run: ./scripts/windows/build-portable.ps1 -NoZip

      - name: Check Inno Setup
        # Inno Setup 6 is preinstalled on the windows-2022/2025 images (6.7.1 at the time of writing).
        # Install it only if it is missing. BibleLive.iss needs 6.5.0 or newer.
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Build the installer
        shell: pwsh
        run: ./scripts/windows/build-installer.ps1 -SkipPortableBuild

      - name: Sign the installer (optional)
        # Skipped unless both secrets are configured.
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host 'No signing secrets configured; leaving the installer unsigned.'
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            foreach ($exe in Get-ChildItem dist/BibleLive-Setup-*.exe) {
              & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($exe.Name)" }
            }
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BibleLive-Setup
          path: dist/BibleLive-Setup-*.exe
          compression-level: 0
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/BibleLive-Setup-*.exe
