name: CI (frontend)

# Backend jobs live in ci.yml; this file runs only when the frontend changes.

on:
  push:
    branches: [main, develop]
    paths: &frontend
      - 'frontend/**'
      - '.node-version'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths: *frontend

# A new push to a PR cancels that PR's run still in progress; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint, types, tests & build
    # The merge commit of a PR was already tested as the PR's merge ref, so its push
    # to main is skipped; direct pushes to main still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    # One job instead of three: each job bills its own rounded-up minute and its own
    # `npm ci`. Tests take ~1.5-2 min of the total.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # No --coverage: nothing reads the report, and it made the suite ~70% slower.
        run: npm test -- --run

      - name: Build production
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Check build output
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ls -lh ../static/frontend/
