name: CI (backend)

# Frontend jobs live in ci-frontend.yml: separate files so each half runs only when its
# own files change (workflow-level path filters cost nothing; a "what changed?" job
# would bill a minute on every run).

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignored
      - 'frontend/**'
      - '.node-version'
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/workflows/macos-spikes.yml'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignored
  # Weekly (and on demand) only the ffmpeg-cache job runs; the test jobs skip.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python lint, types & tests
    # The merge commit of a PR was already tested as the PR's merge ref, so its push
    # to main is skipped; direct pushes to main still run.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    # Install + lint + types + ~1 min of tests takes ~2-3 min; a hung test fails here
    # instead of holding the job to GitHub's 6-hour limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - &image-version
        name: Get runner image version
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - &restore-ffmpeg
        name: Restore ffmpeg packages
        # The Ubuntu mirrors sometimes serve the ~66 MB of ffmpeg .debs at ~40 KB/s,
        # which ran this job into its timeout. Keep the .debs between runs. A PR can
        # only read caches saved on main (or its own earlier runs), so the
        # ffmpeg-cache job below refills main's copy once a week.
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ffmpeg-${{ steps.image.outputs.version }}
          restore-keys: apt-ffmpeg-

      - &install-ffmpeg
        name: Install ffmpeg
        # The live-path tests run real ffmpeg; they fail (not skip) in CI without it.
        # A stalled mirror fails this step in minutes instead of holding the job
        # to its timeout; the .debs fetched so far are still saved below, so a
        # re-run of the job picks up where this one stopped.
        timeout-minutes: 6
        run: |
          # azure.archive.ubuntu.com is first in the runner's mirror list and keeps
          # trickling data, so apt never fails over to archive.ubuntu.com
          # (actions/runner-images#14823). Skip it.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTS update
          # APT_DOWNLOAD_ONLY is set by the ffmpeg-cache job, which only fills the cache.
          sudo apt-get $APT_OPTS install -y --no-install-recommends $APT_DOWNLOAD_ONLY ffmpeg xvfb xauth
          # Drop .debs the archive no longer carries so the cache does not grow.
          sudo apt-get $APT_OPTS autoclean

      - &save-ffmpeg
        name: Save ffmpeg packages
        # Saved even when the install timed out, so a re-run resumes the download. A
        # partial set gets its own key: under the full key it would count as a hit
        # and never be completed. restore-keys picks the newest of either.
        if: always() && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ffmpeg-${{ steps.image.outputs.version }}${{ job.status != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

      - name: Check ffmpeg and tkinter
        run: |
          ffmpeg -version
          python -c "import tkinter"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          # Audio extras are installed so the audio-marked tests run too; the
          # suite is the same one developers run with `make test`. The
          # constraints hold every package to the versions recorded in
          # backend/constraints.txt, so CI tests what a fresh install gets.
          pip install -e "./backend[dev,audio]" -c backend/constraints.txt

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Lint with Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Format check with Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Type check with mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy backend/core backend/audio backend/launcher benchmarks --install-types --non-interactive

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Coverage is printed in this job's log; nothing uploads it (the Codecov
        # upload had no token and was being rate-limited, and nothing read it).
        run: |
          xvfb-run -a python -c "import tkinter; root = tkinter.Tk(); root.destroy()"
          xvfb-run -a pytest backend/tests -v --cov=core --cov-report=term

  ffmpeg-cache:
    name: Fill the ffmpeg package cache on main
    # Merge pushes skip the python job, so without this main never saves the cache
    # and every PR downloads ffmpeg from the mirror again. Weekly rather than on
    # every merge: a billed minute per merge adds up if the repo is private, and
    # PRs reading main's copy keep it from being evicted in between. Downloads only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APT_DOWNLOAD_ONLY: --download-only
    steps:
      - *image-version
      - *restore-ffmpeg
      - *install-ffmpeg
      - *save-ffmpeg

  windows:
    name: Windows backend tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ffmpeg
        # Chocolatey puts a ShimGen shim for ffmpeg.exe on PATH. The shim starts the
        # real ffmpeg as a child, so stopping the capture ends only the shim and the
        # real ffmpeg keeps the stderr pipe open (the live-path tests then fail with
        # "ffmpeg-stderr thread still alive"). Put the real binary first on PATH.
        run: |
          choco install ffmpeg -y --no-progress
          $real = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $real) { throw "real ffmpeg.exe not found under the Chocolatey package" }
          $real.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check ffmpeg
        run: |
          python -c "import shutil; p = shutil.which('ffmpeg'); print(p); assert p and 'lib' in p.lower(), 'ffmpeg resolves to the Chocolatey shim, not the real binary'"
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev,audio]" -c backend/constraints.txt

      - name: Run tests
        run: pytest backend/tests -v -rs
