name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-quality:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -c backend/constraints.txt
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Format check with Ruff
        run: ruff format --check .
        
      - name: Type check with mypy
        run: mypy backend/core backend/audio --install-types --non-interactive

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    # A full leg takes ~2-3 min (install + ~1 min of tests); a hung test fails here
    # instead of holding the job to GitHub's 6-hour limit.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Get runner image version
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache ffmpeg packages
        # The Azure Ubuntu mirror sometimes serves the ~66 MB of ffmpeg .debs at
        # ~40 KB/s, which ran this job into its timeout. Keep the .debs between runs.
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ffmpeg-${{ steps.image.outputs.version }}
          restore-keys: apt-ffmpeg-

      - name: Install ffmpeg
        # The live-path tests run real ffmpeg; they fail (not skip) in CI without it.
        # A stalled mirror fails this step in minutes instead of holding the job
        # to its timeout; re-run the job if it does.
        timeout-minutes: 6
        run: |
          # azure.archive.ubuntu.com is first in the runner's mirror list and keeps
          # trickling data, so apt never fails over to archive.ubuntu.com
          # (actions/runner-images#14823). Skip it.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
          # Drop .debs the archive no longer carries so the cache does not grow.
          sudo apt-get $APT_OPTS autoclean
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Audio extras are installed so the audio-marked tests run too; the
          # suite is the same one developers run with `make test`. The
          # constraints hold every package to the versions recorded in
          # backend/constraints.txt, so CI tests what a fresh install gets.
          pip install -e "./backend[dev,audio]" -c backend/constraints.txt
          
      - name: Run tests
        # Coverage is printed in this job's log; nothing uploads it (the Codecov
        # upload had no token and was being rate-limited, and nothing read it).
        run: pytest backend/tests -v --cov=core --cov-report=term

  frontend-quality:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npm run typecheck
        
      - name: Format check
        run: npm run format:check
        if: always()

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build production
        run: npm run build
        
      - name: Check build output
        run: ls -lh ../static/frontend/
