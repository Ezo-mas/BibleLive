name: CI (backend)

# Frontend jobs live in ci-frontend.yml: separate files so each half runs only when its
# own files change (workflow-level path filters cost nothing; a "what changed?" job
# would bill a minute on every run).

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignored
      - 'frontend/**'
      - '.node-version'
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/workflows/macos-spikes.yml'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignored

# A new push to a PR cancels that PR's run still in progress; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python lint, types & tests
    # The merge commit of a PR was already tested as the PR's merge ref, so its push
    # to main is skipped; direct pushes to main still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    # Install + lint + types + ~1 min of tests takes ~2-3 min; a hung test fails here
    # instead of holding the job to GitHub's 6-hour limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Get runner image version
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache ffmpeg packages
        # The Azure Ubuntu mirror sometimes serves the ~66 MB of ffmpeg .debs at
        # ~40 KB/s, which ran this job into its timeout. Keep the .debs between runs.
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ffmpeg-${{ steps.image.outputs.version }}
          restore-keys: apt-ffmpeg-

      - name: Install ffmpeg
        # The live-path tests run real ffmpeg; they fail (not skip) in CI without it.
        # A stalled mirror fails this step in minutes instead of holding the job
        # to its timeout; re-run the job if it does.
        timeout-minutes: 6
        run: |
          # azure.archive.ubuntu.com is first in the runner's mirror list and keeps
          # trickling data, so apt never fails over to archive.ubuntu.com
          # (actions/runner-images#14823). Skip it.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
          # Drop .debs the archive no longer carries so the cache does not grow.
          sudo apt-get $APT_OPTS autoclean
          ffmpeg -version

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          # Audio extras are installed so the audio-marked tests run too; the
          # suite is the same one developers run with `make test`. The
          # constraints hold every package to the versions recorded in
          # backend/constraints.txt, so CI tests what a fresh install gets.
          pip install -e "./backend[dev,audio]" -c backend/constraints.txt

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Lint with Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Format check with Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Type check with mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy backend/core backend/audio backend/launcher benchmarks --install-types --non-interactive

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Coverage is printed in this job's log; nothing uploads it (the Codecov
        # upload had no token and was being rate-limited, and nothing read it).
        run: pytest backend/tests -v --cov=core --cov-report=term
