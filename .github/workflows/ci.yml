name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-quality:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -c backend/constraints.txt
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Format check with Ruff
        run: ruff format --check .
        
      - name: Type check with mypy
        run: mypy backend/core backend/audio --install-types --non-interactive

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    # A full leg takes ~2-3 min (install + ~1 min of tests); a hung test fails here
    # instead of holding the job to GitHub's 6-hour limit.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install ffmpeg
        # The live-path tests run real ffmpeg; they fail (not skip) in CI without it.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Audio extras are installed so the audio-marked tests run too; the
          # suite is the same one developers run with `make test`. The
          # constraints hold every package to the versions recorded in
          # backend/constraints.txt, so CI tests what a fresh install gets.
          pip install -e "./backend[dev,audio]" -c backend/constraints.txt
          
      - name: Run tests
        # Coverage is printed in this job's log; nothing uploads it (the Codecov
        # upload had no token and was being rate-limited, and nothing read it).
        run: pytest backend/tests -v --cov=core --cov-report=term

  frontend-quality:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npm run typecheck
        
      - name: Format check
        run: npm run format:check
        if: always()

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build production
        run: npm run build
        
      - name: Check build output
        run: ls -lh ../static/frontend/
